# application-prod.properties
spring.application.name=CakesManagement-Prod

# חיבור לבסיס נתונים מאובטח בפרודקשן (הפרטים ייקראו ממשתני סביבה מאובטחים)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# כיבוי מוחלט של קונסולת ה-H2 למניעת פריצות
spring.h2.console.enabled=false

# בפרודקשן לא משתמשים ב-update אלא רק מוודאים (validate) שהבסיס נתונים תואם לאפליקציה
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# הגדרת מקורות מורשים (CORS) בצורה דינמית לפרודקשן
app.cors.allowed-origins=${ALLOWED_ORIGINS}

app.frontend-url=https://sweetsbyefrat.com


# מפתח JWT לפרודקשן
jwt.secret=${JWT_SECRET}

# שרת מיילים לפרודקשן
app.brevo.api-key=${BREVO_API_KEY}
app.mail.from=${MAIL_FROM}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp-relay.brevo.com
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.maximum-pool-size=3

# Load related rows in batches instead of one query per item (fixes N+1)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
